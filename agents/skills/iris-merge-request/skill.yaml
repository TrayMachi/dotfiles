name: iris-merge-request
description: |
  Create or update GitLab merge requests with glab: push the current branch,
  pick the target branch, draft a clear title and description, detect existing
  MRs, and optionally assign reviewers or announce the MR only when explicitly
  requested. Use when the user asks to open, create, update, or prepare an MR.
recommended: true
depends_on:
  - iris-shared
  - iris-gitlab
  - iris-jira
third_party_probes:
  - name: glab
    version_command: ["glab", "--version"]
    install_url: https://gitlab.com/gitlab-org/cli/#installation
