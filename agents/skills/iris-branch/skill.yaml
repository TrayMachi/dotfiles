name: iris-branch
description: |
  Create Jira-backed git branches for OTP implementation work: verify or create
  the Jira ticket, derive the conventional feature/<ticket> branch name, create
  or check out the branch from the remote default base, and optionally hand off
  to iris-worktree without changing the source checkout for isolated checkouts.
  Use when the user asks for a branch from Jira or wants to start durable
  MR-bound work.
recommended: true
depends_on:
  - iris-shared
  - iris-jira
  - iris-worktree
third_party_probes:
  - name: git
    version_command: ["git", "--version"]
    install_url: https://git-scm.com/downloads
