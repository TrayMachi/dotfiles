[audio]
enable_overdrive = true
enable_sounds = true

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.44999998994171619
border = "surface"
end = [ "tray", "recorder", "group:g2", "group:g1", "session" ]
margin_edge = 4
margin_ends = 350
shadow = false
start = [ "workspaces", "media", "widget", "bar" ]
thickness = 32

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "notifications", "network", "bluetooth", "brightness", "battery" ]
    opacity = 0.15000000596046448
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "ram", "cpu" ]
    opacity = 0.15000000596046448
    padding = 6.0

