    community_ids = [ "opencode", "zen-browser", "discord", "telegram", "obsidian", "zed", "heroiclauncher", "steam" ]

        [theme.templates.user.fastfetch]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/fastfetch.jsonc"
        output_path = "$XDG_CONFIG_HOME/fastfetch/noctalia.jsonc"

